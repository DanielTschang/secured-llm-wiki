{{- if .Values.mockPlatform.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-platform
  labels: { app.kubernetes.io/name: mock-platform }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mock-platform }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mock-platform }
    spec:
      automountServiceAccountToken: false
      {{- include "kc.podSecurity" (dict) | nindent 6 }}
      containers:
        - name: mock-platform
          image: {{ .Values.images.mockPlatform }}
          imagePullPolicy: IfNotPresent
          env:
            # /dev/* (token issuing, fault and ACL controls) stays off in the cluster.
            - { name: KC_MOCK_DEV_ENDPOINTS, value: "0" }
            # Hash only; the svc_sync client secret itself lives in Vault.
            - { name: KC_MOCK_SVC_SYNC_SECRET_SHA256, value: {{ .Values.mockPlatform.svcSyncSecretSha256 | quote }} }
          ports:
            - { name: http, containerPort: {{ .Values.mockPlatform.port }} }
          readinessProbe:
            httpGet: { path: /.well-known/jwks.json, port: http }
          {{- include "kc.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-platform
spec:
  selector: { app.kubernetes.io/name: mock-platform }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# L7 allow-list per client role. ACL clients (query) may only ask for readable spaces;
# pages clients (sync) may only read page metadata, content and attachments.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mock-platform-ingress
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: mock-platform }
  ingress:
    - fromEndpoints:
        - matchLabels: { kc.io/platform-client: acl }
      toPorts:
        - ports: [{ port: "{{ .Values.mockPlatform.port }}", protocol: TCP }]
          rules:
            http:
              - { method: GET, path: "/api/me/spaces" }
              - { method: GET, path: "/\\.well-known/jwks\\.json" }
    - fromEndpoints:
        - matchLabels: { kc.io/platform-client: pages }
      toPorts:
        - ports: [{ port: "{{ .Values.mockPlatform.port }}", protocol: TCP }]
          rules:
            http:
              - { method: POST, path: "/oauth/token" }
              - { method: GET, path: "/api/spaces/sp_[a-z0-9_]+/pages" }
              - { method: GET, path: "/api/pages/[A-Za-z0-9_]+" }
              - { method: GET, path: "/api/pages/[A-Za-z0-9_]+/attachments/[A-Za-z0-9_.-]+" }
              - { method: GET, path: "/\\.well-known/jwks\\.json" }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-client-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: kc.io/platform-client
        operator: In
        values: [acl, pages]
  egress:
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: mock-platform }
      toPorts:
        - ports: [{ port: "{{ .Values.mockPlatform.port }}", protocol: TCP }]
{{- end }}
