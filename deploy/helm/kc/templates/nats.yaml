{{- if .Values.apps.enabled }}
{{- $stream := "KC_PAGES" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kc-nats
data:
  # Passwords are bcrypt hashes; plaintexts live only in Vault. Messages carry IDs only.
  nats.conf: |
    port: 4222
    http: 8222
    jetstream {
      store_dir: /data
      max_memory_store: 64MB
      max_file_store: 512MB
    }
    authorization {
      users: [
        {
          user: sync
          password: "{{ required "nats.syncPasswordBcrypt (run dev_bootstrap.py)" .Values.nats.syncPasswordBcrypt }}"
          permissions: {
            publish: { allow: ["kc.page.>"] }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        {
          user: ingest
          password: "{{ required "nats.ingestPasswordBcrypt" .Values.nats.ingestPasswordBcrypt }}"
          permissions: {
            publish: {
              allow: [
                {{- range .Values.spaces }}
                "$JS.API.CONSUMER.MSG.NEXT.{{ $stream }}.ingest-{{ include "kc.dns" .id }}",
                "$JS.API.CONSUMER.INFO.{{ $stream }}.ingest-{{ include "kc.dns" .id }}",
                {{- end }}
                "$JS.ACK.{{ $stream }}.>"
              ]
            }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        {
          # Used only by dev_bootstrap.py (through port-forward) to create the stream.
          user: admin
          password: "{{ required "nats.adminPasswordBcrypt" .Values.nats.adminPasswordBcrypt }}"
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kc-nats
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-nats
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { kc.io/component: nats }
  template:
    metadata:
      labels: { kc.io/component: nats }
      annotations:
        checksum/config: {{ .Values.nats | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "kc.podSecurity" (dict) | nindent 6 }}
      containers:
        - name: nats
          image: {{ .Values.images.nats }}
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: monitor }
          {{- include "kc.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: kc-nats }
        - name: data
          persistentVolumeClaim: { claimName: kc-nats }
---
apiVersion: v1
kind: Service
metadata:
  name: kc-nats
spec:
  selector: { kc.io/component: nats }
  ports:
    - { name: client, port: 4222, targetPort: client }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kc-nats
spec:
  endpointSelector:
    matchLabels: { kc.io/component: nats }
  ingress:
    {{- include "kc.ingressFrom" (dict "from" (list "sync" "ingest-worker" "test-runner") "port" 4222) | nindent 4 }}
{{- end }}
