{{- if .Values.apps.enabled }}
{{- $egress := dict "vault" 8200 "minio" 9000 "mongodb" 27017 "nats" 4222 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kc-sync
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kc-ingest-worker
automountServiceAccountToken: false
---
# Sync reads every space (fetch, encrypt, store, publish) and nothing else: no graph,
# no model service. Pages-client role on the platform's L7 policy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kc-sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            kc.io/component: sync
            kc.io/platform-client: pages
        spec:
          serviceAccountName: kc-sync
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- include "kc.podSecurity" (dict) | nindent 10 }}
          containers:
            - name: sync
              image: {{ .Values.images.app }}
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "sync.main"]
              env:
                {{- include "kc.appEnv" . | nindent 16 }}
                - { name: KC_PLATFORM_URL, value: "http://mock-platform" }
              {{- include "kc.containerSecurity" . | nindent 14 }}
              volumeMounts:
                - { name: vault-token, mountPath: /var/run/secrets/kc, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            {{- include "kc.vaultTokenVolume" . | nindent 12 }}
            - { name: tmp, emptyDir: {} }
---
# ingest-worker (ADR-006, ADR-011). Separate containers, separate PID namespaces:
#   broker:          holds the ServiceAccount token, consumes NATS, mints child tokens,
#                    routes each task to its own space's runner.
#   runner-<space>:  one per space, no ServiceAccount token; runs that space's tasks only,
#                    token on stdin. Its socket volume is shared with the broker alone, so
#                    a compromised task cannot reach another space's runner or tokens.
# No platform access and no outbound path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-ingest-worker
spec:
  replicas: 1
  selector:
    matchLabels: { kc.io/component: ingest-worker }
  template:
    metadata:
      labels: { kc.io/component: ingest-worker }
    spec:
      serviceAccountName: kc-ingest-worker
      automountServiceAccountToken: false
      shareProcessNamespace: false
      {{- include "kc.podSecurity" (dict) | nindent 6 }}
      containers:
        - name: broker
          image: {{ .Values.images.app }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ingest_worker.main"]
          env:
            {{- include "kc.appEnv" . | nindent 12 }}
            - { name: KC_RUNNER_SOCKET_ROOT, value: /run/kc }
          {{- include "kc.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: vault-token, mountPath: /var/run/secrets/kc, readOnly: true }
            - { name: broker-tmp, mountPath: /tmp }
            {{- range .Values.spaces }}
            - { name: socket-{{ include "kc.dns" .id }}, mountPath: /run/kc/{{ .id }} }
            {{- end }}
        {{- range .Values.spaces }}
        - name: runner-{{ include "kc.dns" .id }}
          image: {{ $.Values.images.app }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ingest_worker.runner"]
          env:
            - { name: KC_RUNNER_SPACE, value: {{ .id | quote }} }
            - { name: KC_MODEL_BASE_URL, value: "http://kc-model-gateway:8080/v1" }
            - { name: KC_MODEL_NAME, value: {{ $.Values.model.name | quote }} }
            - { name: KC_MODEL_ALLOWED_HOSTS, value: kc-model-gateway }
            - { name: KC_SCHEMA_DIR, value: /app/schema }
            - { name: KC_RUNNER_SOCKET_ROOT, value: /run/kc }
            - { name: KC_VAULT_ADDR, value: "http://kc-vault:8200" }
            - { name: KC_MONGO_HOST, value: "kc-mongodb:27017" }
            - { name: HOME, value: /tmp }
          {{- include "kc.containerSecurity" $ | nindent 10 }}
          volumeMounts:
            - { name: socket-{{ include "kc.dns" .id }}, mountPath: /run/kc/{{ .id }} }
            - { name: tmp-{{ include "kc.dns" .id }}, mountPath: /tmp }
        {{- end }}
      volumes:
        {{- include "kc.vaultTokenVolume" . | nindent 8 }}
        - { name: broker-tmp, emptyDir: {} }
        {{- range .Values.spaces }}
        - { name: socket-{{ include "kc.dns" .id }}, emptyDir: {} }
        - { name: tmp-{{ include "kc.dns" .id }}, emptyDir: {} }
        {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kc-sync-egress
spec:
  endpointSelector:
    matchLabels: { kc.io/component: sync }
  egress:
    {{- range $component, $port := $egress }}
    - toEndpoints:
        - matchLabels: { kc.io/component: {{ $component }} }
      toPorts:
        - ports: [{ port: "{{ $port }}", protocol: TCP }]
    {{- end }}
---
{{- $workers := list "ingest-worker" }}
{{- if .Values.devTestRunner }}{{ $workers = append $workers "test-runner" }}{{ end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kc-ingest-worker-egress
spec:
  endpointSelector:
    matchExpressions:
      - { key: kc.io/component, operator: In, values: {{ toJson $workers }} }
  egress:
    {{- range $component, $port := $egress }}
    - toEndpoints:
        - matchLabels: { kc.io/component: {{ $component }} }
      toPorts:
        - ports: [{ port: "{{ $port }}", protocol: TCP }]
    {{- end }}
    - toEndpoints:
        - matchLabels: { kc.io/component: neo4j }
      toPorts:
        - ports: [{ port: "7687", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { kc.io/component: model-gateway }
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
{{- end }}
