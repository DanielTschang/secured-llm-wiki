[project]
name = "kc-obs"
version = "0.1.0"
description = "Logger and metrics that accept only IDs and numbers (invariant 7)"
requires-python = ">=3.14"
dependencies = ["kc-labels", "kc-ids"]

[tool.uv.sources]
kc-labels = { workspace = true }
kc-ids = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_obs"]
