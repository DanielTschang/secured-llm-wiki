[project]
name = "kc-graph"
version = "0.1.0"
description = "Per-space Neo4j adapter"
requires-python = ">=3.14"
dependencies = ["kc-labels", "kc-ids", "neo4j>=5.26", "networkx>=3.4"]

[tool.uv.sources]
kc-labels = { workspace = true }
kc-ids = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_graph"]
