[project]
name = "kc-platform"
version = "0.1.0"
description = "Platform API client: verified identity, readable spaces (fail closed), getPages"
requires-python = ">=3.14"
dependencies = ["kc-labels", "httpx>=0.27", "pyjwt[crypto]>=2.9"]

[tool.uv.sources]
kc-labels = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_platform"]
