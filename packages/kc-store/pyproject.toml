[project]
name = "kc-store"
version = "0.1.0"
description = "SpaceContext and per-space encrypted MongoDB/MinIO adapters"
requires-python = ">=3.14"
dependencies = ["kc-labels", "kc-ids", "kc-graph", "kc-okf", "httpx>=0.27", "cryptography>=43", "pymongo>=4.10", "boto3>=1.35"]

[tool.uv.sources]
kc-labels = { workspace = true }
kc-ids = { workspace = true }
kc-graph = { workspace = true }
kc-okf = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_store"]
