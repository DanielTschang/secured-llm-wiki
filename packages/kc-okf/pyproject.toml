[project]
name = "kc-okf"
version = "0.1.0"
description = "OKF v0.2 documents for space wiki bundles: parse, render, host-owned frontmatter, body checks"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_okf"]
