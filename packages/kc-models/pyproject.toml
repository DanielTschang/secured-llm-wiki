[project]
name = "kc-models"
version = "0.1.0"
description = "The only way to call a model: OpenAI-compatible backend (internal hosts only) and a fake for tests"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kc_models"]
