[project]
name = "model-gateway"
version = "0.1.0"
description = "In-cluster OpenAI-compatible pass-through to the on-prem model server; logs no content"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "kc-obs"]

[tool.uv.sources]
kc-obs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_gateway"]
