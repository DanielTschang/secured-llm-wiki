[project]
name = "mock-platform"
version = "0.1.0"
description = "Mock knowledge platform API and JWT issuer (development and tests only)"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt[crypto]>=2.9", "cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_platform"]
